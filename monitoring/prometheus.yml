# 五常同城 Prometheus 监控配置
# 抓取 backend / postgres / redis / rabbitmq / node-exporter 指标

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'wuchang-monitor'

scrape_configs:
  # Prometheus 自身指标
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 后端服务指标（/metrics 端点）
  - job_name: 'backend'
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:8088']

  # 主机指标（CPU/内存/磁盘/网络）
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # PostgreSQL 数据库指标
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Redis 缓存指标
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # RabbitMQ 消息队列指标
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq-exporter:9419']
