# 五常同城项目 Docker Compose 配置
# 包含开发环境所需的所有基础设施服务

version: '3.8'

services:
  # PostgreSQL 数据库（带PostGIS扩展）
  postgres:
    image: postgis/postgis:16-3.4
    container_name: wuchang-postgres
    restart: unless-stopped
    ports:
      - "${WCTC_POSTGRES_PORT:-5434}:5432"
    environment:
      POSTGRES_DB: wuchang_tongcheng
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    networks:
      - wuchang-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: wuchang-redis
    restart: unless-stopped
    ports:
      - "${WCTC_REDIS_PORT:-6380}:6379"
    command: redis-server --appendonly yes --requirepass redis123
    volumes:
      - redis_data:/data
    networks:
      - wuchang-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ 消息队列
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: wuchang-rabbitmq
    restart: unless-stopped
    ports:
      - "${WCTC_RABBITMQ_AMQP_PORT:-5673}:5672"   # AMQP协议端口
      - "${WCTC_RABBITMQ_MGMT_PORT:-15673}:15672" # 管理界面端口
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
      RABBITMQ_DEFAULT_VHOST: /wuchang
      TZ: Asia/Shanghai
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - wuchang-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Elasticsearch 搜索引擎
  elasticsearch:
    image: elasticsearch:8.12.0
    container_name: wuchang-elasticsearch
    restart: unless-stopped
    ports:
      - "${WCTC_ELASTICSEARCH_PORT:-9210}:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - TZ=Asia/Shanghai
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - wuchang-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Kibana（可选，用于Elasticsearch可视化）
  kibana:
    image: kibana:8.12.0
    container_name: wuchang-kibana
    restart: unless-stopped
    ports:
      - "${WCTC_KIBANA_PORT:-5602}:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - TZ=Asia/Shanghai
    depends_on:
      - elasticsearch
    networks:
      - wuchang-network
    profiles:
      - optional

  # MinIO 对象存储（开发环境替代七牛云）
  minio:
    image: minio/minio:latest
    container_name: wuchang-minio
    restart: unless-stopped
    ports:
      - "${WCTC_MINIO_API_PORT:-9010}:9000"   # API端口
      - "${WCTC_MINIO_CONSOLE_PORT:-9011}:9001"   # 控制台端口
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      TZ: Asia/Shanghai
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - wuchang-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    profiles:
      - optional

  # pgAdmin（可选，PostgreSQL管理工具）
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: wuchang-pgadmin
    restart: unless-stopped
    ports:
      - "${WCTC_PGADMIN_PORT:-5051}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@wuchang.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      TZ: Asia/Shanghai
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - wuchang-network
    profiles:
      - optional

  # ===============================
  # 监控基座（Prometheus + Grafana）
  # ===============================

  # Prometheus 监控数据采集
  prometheus:
    image: prom/prometheus:latest
    container_name: wuchang-prometheus
    restart: unless-stopped
    ports:
      - "${WCTC_PROMETHEUS_PORT:-9090}:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - wuchang-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Grafana 可视化仪表盘
  grafana:
    image: grafana/grafana:latest
    container_name: wuchang-grafana
    restart: unless-stopped
    ports:
      - "${WCTC_GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      TZ: Asia/Shanghai
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - wuchang-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # node-exporter 主机指标采集
  node-exporter:
    image: prom/node-exporter:latest
    container_name: wuchang-node-exporter
    restart: unless-stopped
    ports:
      - "${WCTC_NODE_EXPORTER_PORT:-9100}:9100"
    command:
      - '--path.rootfs=/host'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    networks:
      - wuchang-network

  # postgres-exporter PostgreSQL 指标采集
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: wuchang-postgres-exporter
    restart: unless-stopped
    ports:
      - "${WCTC_PG_EXPORTER_PORT:-9187}:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres123@postgres:5432/wuchang_tongcheng?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wuchang-network

  # redis-exporter Redis 指标采集
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: wuchang-redis-exporter
    restart: unless-stopped
    ports:
      - "${WCTC_REDIS_EXPORTER_PORT:-9121}:9121"
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: redis123
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - wuchang-network

  # rabbitmq-exporter RabbitMQ 指标采集（可选，需 --profile monitoring 启动）
  rabbitmq-exporter:
    image: kbudde/rabbitmq-exporter:latest
    container_name: wuchang-rabbitmq-exporter
    restart: unless-stopped
    ports:
      - "${WCTC_RABBITMQ_EXPORTER_PORT:-9419}:9419"
    environment:
      RABBIT_URL: "http://rabbitmq:15672"
      RABBIT_USER: admin
      RABBIT_PASSWORD: admin123
    depends_on:
      - rabbitmq
    networks:
      - wuchang-network
    profiles:
      - monitoring

  # ===============================
  # 应用服务（backend / admin / pc）
  # ===============================

  # 后端服务
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: wuchang-backend
    restart: unless-stopped
    ports:
      - "${WCTC_SERVER_PORT:-8088}:8088"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres123
      DB_NAME: wuchang_tongcheng
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis123
      ES_HOST: http://elasticsearch:9200
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: admin
      RABBITMQ_PASSWORD: admin123
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - wuchang-network
    profiles:
      - app

  # 管理后台（Vue3 + Vite 构建产物，Nginx 托管）
  admin:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: wuchang-admin
    restart: unless-stopped
    ports:
      - "${WCTC_ADMIN_PORT:-5177}:80"
    depends_on:
      - backend
    networks:
      - wuchang-network
    profiles:
      - app

  # PC 门户（Next.js 16 SSR）
  pc:
    build:
      context: ../frontend/pc
      dockerfile: Dockerfile
    container_name: wuchang-pc
    restart: unless-stopped
    ports:
      - "${WCTC_PC_PORT:-3010}:3000"
    environment:
      BACKEND_URL: http://backend:8088
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - wuchang-network
    profiles:
      - app

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  es_data:
    driver: local
  minio_data:
    driver: local
  pgadmin_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  wuchang-network:
    driver: bridge
