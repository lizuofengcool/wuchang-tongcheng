# 五常同城 - 持续集成流水线
# 触发：push 到 main/develop 分支，或针对 main 分支的 PR
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ===== 后端：Go vet + 单元测试 =====
  backend-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        working-directory: backend
        run: go mod download

      - name: Run vet
        working-directory: backend
        run: go vet ./...

      - name: Run tests
        working-directory: backend
        run: go test ./... -v -cover

      - name: Build check
        working-directory: backend
        run: go build ./...

  # ===== 前端管理后台：构建验证 =====
  frontend-build:
    name: Frontend Admin Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  # ===== PC 门户：构建验证 =====
  pc-build:
    name: Frontend PC Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/pc/package-lock.json

      - name: Install
        working-directory: frontend/pc
        run: npm ci

      - name: Build
        working-directory: frontend/pc
        run: npm run build
